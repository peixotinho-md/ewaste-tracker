<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ler QR Code · e-Trilha MS</title>
<meta name="theme-color" content="#22773f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/jsqr.js"></script>
</head>
<body>

<header class="cabecalho"><div data-cabecalho></div></header>

<main>

  <h1>Leitura de etiqueta</h1>
  <p class="sutil" style="margin-top:-.5rem">
    Tela de quem opera a cadeia: ponto de coleta, cooperativa, transporte e recicladora.
    Ler o QR registra a passagem do aparelho pela etapa — por isso ela exige conta de operador.
  </p>

  <div id="area"></div>

</main>

<footer class="rodape">e-Trilha MS · Protótipo acadêmico — DAC 262 TADS.</footer>

<script type="module">
import * as store from './js/store.js';
import { iniciarPagina, aviso, seloEtapa, seloPapel, confirmar, formatarData,
         formatarMassa, escapar } from './js/ui.js';
import { normalizarCodigo, categoria, proximaEtapa, ETAPAS, ETAPA_FINAL,
         etapa as definicaoEtapa, exigeApagamento, metodosParaMidia,
         MIDIAS, METODOS_APAGAMENTO } from './js/model.js';
import { LeitorQR } from './js/qr.js';

await iniciarPagina();

const area = document.getElementById('area');

/* ------------------------------------------------------------------ *
 * Guarda de acesso
 *
 * Quem lê a etiqueta é quem ESCREVE na cadeia de custódia: cada leitura grava
 * um evento afirmando que o aparelho passou por uma etapa, assinado com o nome
 * de quem registrou. Aberta a qualquer visitante, essa declaração não provaria
 * nada — daria para avançar a etapa de um aparelho que nunca se recebeu, ou
 * emitir um atestado de apagamento sem ter destruído mídia alguma.
 *
 * A verificação daqui apenas evita mostrar uma tela que não vai funcionar.
 * Quem realmente fecha a porta é o servidor: `POST /api/itens/<codigo>/eventos`
 * responde 401 a quem não entrou e 403 a quem entrou sem ser operador, mesmo
 * que a chamada venha de fora da tela.
 * ------------------------------------------------------------------ */

const operador = await store.exigirPapel('operador', 'admin');
const pontos = await store.listarPontos();

/* Guardado aqui porque a câmera precisa ser desligada se o papel for revogado
   no meio da operação e a tela trocar. */
let leitor = null;

if (operador) {
  area.innerHTML = telaOperacao();
  ligarCamera();
  ligarEntradaManual();
  abrirDaUrl();
} else {
  area.innerHTML = await telaSemAcesso();
}

/**
 * Explica por que a tela está fechada e leva ao login, preservando o destino.
 *
 * Sem servidor no ar não há como saber quem é a pessoa, então cai aqui também.
 * A mensagem separa os dois casos: o problema pode ser de permissão ou de
 * conexão, e a saída é diferente em cada um. Nada de fila de gravações
 * offline — um evento gravado localmente sem passar pela validação do servidor
 * furaria a cadeia de custódia.
 */
async function telaSemAcesso() {
  const usuario = await store.usuarioAtual();

  if (!usuario) {
    return `
      <section class="cartao" style="max-width:640px">
        <h2>Esta área é da operação</h2>
        <p>
          Registrar a passagem de um aparelho é declarar, com assinatura, que ele
          esteve em suas mãos naquela etapa. Por isso é preciso entrar com uma
          conta de <strong>operador</strong> antes de abrir o leitor.
        </p>
        <div class="botoes">
          <a class="botao" href="index?destino=scanner">Entrar como operador</a>
          <a class="botao botao-secundario" href="rastrear">Só quero consultar um código</a>
        </div>
        <p class="dica" style="margin-top:1rem">
          Se o servidor estiver fora do ar, esta tela também não abre: a gravação
          precisa da validação do servidor para não furar a cadeia de custódia.
          A consulta pública continua funcionando com os dados já guardados.
        </p>
      </section>`;
  }

  return `
    <section class="cartao" style="max-width:640px">
      <h2>Sua conta não é de operador</h2>
      <p>
        Você entrou como <strong>${escapar(usuario.nome)}</strong> ${seloPapel(usuario.papel)}.
        Esta conta registra e acompanha os próprios aparelhos, mas não grava
        etapas na cadeia de custódia de terceiros.
      </p>
      <p class="sutil">
        Quem concede o papel de operador é um administrador, que também vincula
        a conta ao ponto de coleta onde você trabalha. A concessão fica
        registrada na trilha de administração.
      </p>
      <div class="botoes">
        <a class="botao botao-secundario" href="conta">Ver minha conta</a>
        <a class="botao botao-secundario" href="rastrear">Consultar por código</a>
      </div>
    </section>`;
}

/* ------------------------------------------------------------------ *
 * Tela da operação
 * ------------------------------------------------------------------ */

function telaOperacao() {
  const ponto = pontos.find((p) => p.id === operador.pontoId);
  return `
    <div class="faixa faixa-info">
      Operando como <strong>${escapar(operador.nome)}</strong> ${seloPapel(operador.papel)}
      ${ponto
        ? `— ${escapar(ponto.nome)}, ${escapar(ponto.municipio)}.`
        : '— sem ponto fixo vinculado; o local é escolhido a cada registro.'}
      É este nome que assina cada etapa registrada.
    </div>

    <div class="grade grade-2" style="align-items:start">

      <section class="cartao">
        <h2>Câmera</h2>
        <div class="camera">
          <video id="video" muted playsinline></video>
          <div class="mira"></div>
          <div class="estado" id="estado-camera">Câmera desligada.</div>
        </div>
        <div class="botoes" style="margin-top:.8rem">
          <button class="botao" id="btn-camera">Ligar câmera</button>
        </div>
        <p class="dica" style="margin-top:.6rem">
          O navegador pede sua permissão antes de acessar a câmera — é o sistema
          operacional que controla o dispositivo, não esta página. A câmera só é
          liberada em páginas seguras: use <code>http://localhost</code> ou HTTPS.
        </p>

        <hr style="border:none;border-top:1px solid var(--borda);margin:1.2rem 0">

        <h2>Ou digite o código</h2>
        <p class="sutil">Sempre disponível — etiqueta riscada, suja ou câmera indisponível não podem travar a operação.</p>
        <form class="busca-codigo" id="form-manual">
          <label class="oculto" for="manual">Código de rastreio</label>
          <input id="manual" placeholder="MS-0000-0000" autocomplete="off" spellcheck="false" maxlength="14" required>
          <button class="botao" type="submit">Abrir</button>
        </form>
      </section>

      <section id="painel-item">
        <div class="cartao vazio">Leia uma etiqueta ou digite um código para começar.</div>
      </section>

    </div>`;
}

/* ------------------------------------------------------------------ *
 * Câmera
 * ------------------------------------------------------------------ */

function ligarCamera() {
  const estado = document.getElementById('estado-camera');
  const btnCamera = document.getElementById('btn-camera');

  leitor = new LeitorQR(document.getElementById('video'), {
    onLeitura: (texto, codigo) => {
      if (codigo) {
        // Vibra onde o hardware permite: confirma a leitura sem exigir olhar a tela.
        navigator.vibrate?.(80);
        estado.textContent = `Lido: ${codigo} · ${leitor.metodo}`;
        abrir(codigo);
      } else {
        estado.textContent = 'QR lido, mas não é uma etiqueta do e-Trilha MS.';
      }
    },
    onErro: (erro) => { estado.textContent = `Falha ao analisar o quadro: ${erro.message}`; },
  });

  btnCamera.addEventListener('click', async () => {
    if (leitor.ativo) {
      leitor.parar();
      btnCamera.textContent = 'Ligar câmera';
      estado.textContent = 'Câmera desligada.';
      return;
    }
    estado.textContent = 'Solicitando permissão…';
    try {
      await leitor.iniciar();
      btnCamera.textContent = 'Desligar câmera';
      estado.textContent = `Procurando etiqueta… (${leitor.metodo})`;
    } catch (erro) {
      estado.textContent = erro.message;
      aviso(erro.message, 'erro');
    }
  });

  window.addEventListener('pagehide', () => leitor.parar());
}

/* ------------------------------------------------------------------ *
 * Entrada manual
 * ------------------------------------------------------------------ */

function ligarEntradaManual() {
  document.getElementById('form-manual').addEventListener('submit', (ev) => {
    ev.preventDefault();
    const codigo = normalizarCodigo(document.getElementById('manual').value);
    if (!codigo) {
      aviso('Código inválido. Confira o prefixo MS e o dígito verificador.', 'erro');
      return;
    }
    abrir(codigo);
  });
}

/* ------------------------------------------------------------------ *
 * Painel do item lido
 * ------------------------------------------------------------------ */

async function abrir(codigo) {
  const painel = document.getElementById('painel-item');
  const rastreio = await store.obterRastreio(codigo);

  if (!rastreio) {
    painel.innerHTML = `
      <div class="cartao">
        <div class="faixa faixa-alerta">
          <strong>Código ${escapar(codigo)} não encontrado.</strong>
          Nenhum aparelho registrado com este código.
        </div>
        <a class="botao" href="registrar">Registrar este aparelho</a>
      </div>`;
    return;
  }

  const { item } = rastreio;
  const cat = categoria(item.categoria);
  const proxima = proximaEtapa(item.etapaAtual);
  const ultimo = rastreio.eventos.at(-1);

  painel.innerHTML = `
    <div class="cartao">
      <div class="secao-titulo">
        <div>
          <code style="font-size:1.15rem;color:var(--verde-600);font-weight:700">${escapar(item.codigo)}</code>
          <h2 style="margin:.2rem 0 0">${escapar(cat?.rotulo ?? item.categoria)}</h2>
          ${item.marca ? `<p class="sutil" style="margin:0">${escapar(item.marca)}</p>` : ''}
        </div>
        ${seloEtapa(item.etapaAtual)}
      </div>

      <dl class="trilha-dados" style="margin:.8rem 0">
        <div><dt>Peso</dt><dd>${formatarMassa(item.pesoKg)}</dd></div>
        <div><dt>Etapa atual desde</dt><dd>${formatarData(item.atualizadoEm)}</dd></div>
        <div><dt>Último responsável</dt><dd>${escapar(ultimo?.responsavel ?? '—')}</dd></div>
      </dl>

      ${proxima ? formularioAvanco(item, proxima) : `
        <div class="faixa" style="border-color:var(--verde-500)">
          <strong>✓ Cadeia concluída.</strong> Este aparelho já foi processado e tem
          certificado de destinação final. Não há etapa seguinte a registrar.
        </div>`}

      <p style="margin-top:1rem">
        <a href="rastrear?c=${encodeURIComponent(item.codigo)}">Ver a trilha completa deste aparelho →</a>
      </p>

      <details class="nao-imprimir" style="margin-top:1rem">
        <summary class="sutil">Testar a validação da máquina de estados</summary>
        <p class="dica" style="margin-top:.5rem">
          Escolha qualquer etapa e tente registrar. O sistema só aceita o passo
          imediatamente seguinte: pular etapa apagaria a prova de que o aparelho
          passou pela triagem, e retroceder permitiria mascarar um extravio.
        </p>
        <div class="busca-codigo">
          <select id="etapa-livre">
            ${ETAPAS.map((e) => `<option value="${e.id}"${e.id === item.etapaAtual ? ' selected' : ''}>${escapar(e.rotulo)}</option>`).join('')}
          </select>
          <button class="botao botao-secundario" id="btn-livre" type="button">Tentar registrar</button>
        </div>
      </details>
    </div>`;

  if (proxima) {
    ligarFormulario(item, proxima);
    if (proxima.id === 'EM_TRIAGEM') ligarApagamento(item);
  }

  document.getElementById('btn-livre').addEventListener('click', async (ev) => {
    // Passa pela mesma confirmação do fluxo normal: se a etapa escolhida for
    // válida, isto grava de verdade — não é uma simulação.
    const etapaId = document.getElementById('etapa-livre').value;
    await avancar(ev.currentTarget, item, etapaId, coletarDados());
  });
}

/**
 * Formulário da próxima etapa.
 *
 * Não há campo "responsável": quem assina é a conta autenticada, e é o
 * servidor que preenche esse campo. Um nome digitado provaria apenas que
 * alguém sabe digitar.
 */
function formularioAvanco(item, proxima) {
  const meuPonto = pontos.find((p) => p.id === operador.pontoId);
  const aceitos = pontos.filter((p) => p.aceita.includes(item.categoria));

  return `
    <div class="faixa faixa-info">
      Próxima etapa: <strong>${escapar(proxima.rotulo)}</strong> — ${escapar(proxima.descricao)}
    </div>

    <div class="campo">
      <label for="ponto-ev">Local / organização</label>
      ${meuPonto
        ? `<input id="ponto-ev" value="${escapar(meuPonto.nome)} — ${escapar(meuPonto.municipio)}" disabled>
           <p class="dica">Vem do ponto vinculado à sua conta. O servidor grava este
              local independentemente do que a tela enviar, para ninguém registrar
              passagem por onde não trabalha.</p>`
        : `<select id="ponto-ev">
             <option value="">Não informar</option>
             ${aceitos.map((p) => `<option value="${p.id}"${p.id === item.pontoOrigemId ? ' selected' : ''}>${escapar(p.nome)} — ${escapar(p.municipio)}</option>`).join('')}
           </select>
           <p class="dica">Sua conta não tem ponto fixo vinculado, então o local é escolhido aqui.</p>`}
    </div>

    ${proxima.id === 'EM_TRIAGEM' ? blocoApagamento(item) : ''}

    <div class="campo">
      <label for="obs-ev">Observação <span class="sutil">(opcional)</span></label>
      <textarea id="obs-ev" maxlength="240" placeholder="Ex.: bateria removida e separada; carcaça trincada"></textarea>
    </div>
    <div class="botoes">
      <button class="botao botao-grande" id="btn-avancar" type="button">
        Registrar "${escapar(proxima.rotulo)}"
      </button>
    </div>`;
}

/**
 * Atestado de apagamento, exigido ao concluir a triagem de aparelhos que
 * carregam memória não volátil. A lista de métodos muda conforme o tipo de
 * mídia porque o que destrói o dado num disco magnético não destrói em flash.
 */
function blocoApagamento(item) {
  if (!exigeApagamento(item.categoria)) {
    return `
      <div class="faixa">
        Esta categoria não carrega mídia de dados — nada a apagar.
      </div>`;
  }
  return `
    <fieldset style="border:1px solid var(--borda);border-radius:var(--raio-sm);padding:.9rem;margin:0 0 1rem">
      <legend class="sutil">Atestado de apagamento de dados</legend>
      <p class="dica" style="margin-top:0">
        Este aparelho tem memória não volátil e pode sair com dados dentro.
        Formatar ou apagar arquivos <strong>não destrói o conteúdo</strong>.
        Informe a mídia e o método usado.
      </p>
      <div class="campo">
        <label for="midia-ev">Tipo de mídia</label>
        <select id="midia-ev">
          ${Object.entries(MIDIAS)
            .map(([id, m]) => `<option value="${id}">${escapar(m.rotulo)}</option>`)
            .join('')}
        </select>
      </div>
      <div class="campo" style="margin-bottom:0">
        <label for="metodo-ev">Método de destruição dos dados</label>
        <select id="metodo-ev"></select>
        <p class="dica" id="dica-metodo"></p>
      </div>
    </fieldset>`;
}

/** Repovoa os métodos válidos sempre que a mídia muda. */
function ligarApagamento(item) {
  const selMidia = document.getElementById('midia-ev');
  const selMetodo = document.getElementById('metodo-ev');
  if (!selMidia || !selMetodo) return;

  function atualizar() {
    const validos = metodosParaMidia(selMidia.value);
    selMetodo.innerHTML = validos
      .map((m) => `<option value="${m.id}">${escapar(m.rotulo)}</option>`)
      .join('');

    // Mostra o que ficou de fora e por quê: é a parte que explica a regra.
    const excluidos = Object.entries(METODOS_APAGAMENTO)
      .filter(([id]) => !validos.some((v) => v.id === id))
      .filter(([id]) => id !== 'NAO_APLICAVEL' || selMidia.value !== 'sem_midia');

    document.getElementById('dica-metodo').innerHTML = excluidos.length
      ? `Não disponível para esta mídia: ${excluidos
          .map(([, def]) => `<strong>${escapar(def.rotulo)}</strong> — ${escapar(def.porqueNao)}`)
          .join(' ')}`
      : '';
  }

  selMidia.addEventListener('change', atualizar);
  // Aparelho com mídia começa em flash, que é o caso mais comum hoje.
  selMidia.value = exigeApagamento(item.categoria) ? 'flash' : 'sem_midia';
  atualizar();
}

function ligarFormulario(item, proxima) {
  document.getElementById('btn-avancar').addEventListener('click', async (ev) => {
    await avancar(ev.currentTarget, item, proxima.id, coletarDados());
  });
}

/** Lê o formulário. O responsável não está aqui: quem preenche é o servidor. */
function coletarDados() {
  const selMidia = document.getElementById('midia-ev');
  const selPonto = document.getElementById('ponto-ev');
  return {
    // Campo desabilitado (ponto fixo do operador) não tem valor a enviar — e o
    // servidor usaria o ponto da conta de qualquer forma.
    pontoId: selPonto && !selPonto.disabled ? selPonto.value || null : null,
    observacao: document.getElementById('obs-ev')?.value ?? '',
    apagamento: selMidia
      ? { midia: selMidia.value, metodo: document.getElementById('metodo-ev').value }
      : null,
  };
}

/* ------------------------------------------------------------------ *
 * Confirmação e gravação
 * ------------------------------------------------------------------ */

/**
 * Mostra o que será gravado e só então grava.
 *
 * O histórico é somente de acréscimo — os gatilhos do banco recusam UPDATE e
 * DELETE em `eventos`, então NÃO EXISTE desfazer. Num galpão com dezenas de
 * aparelhos, ler o QR errado é fácil; por isso a confirmação repete o código e
 * a categoria do aparelho, e não só a etapa.
 */
async function avancar(botao, item, etapaId, dados) {
  const ok = await confirmarRegistro(item, etapaId, dados);
  if (!ok) return;

  // Trava o botão durante a chamada: dois cliques seguidos gravariam dois
  // eventos, e o segundo já não teria como ser apagado.
  const textoOriginal = botao.textContent;
  botao.disabled = true;
  botao.textContent = 'Registrando…';

  try {
    await store.registrarEvento(item.codigo, { etapa: etapaId, ...dados });
    const rotulo = definicaoEtapa(etapaId).rotulo;
    aviso(
      etapaId === ETAPA_FINAL
        ? `${item.codigo}: reciclagem concluída, certificado emitido.`
        : `${item.codigo} avançou para "${rotulo}".`
    );
    await abrir(item.codigo);
  } catch (erro) {
    // A regra é aplicada no servidor, não na tela: a interface só mostra o motivo.
    aviso(erro.message, 'erro');
    if (erro.status === 401 || erro.status === 403) {
      // O papel pode ter sido revogado no meio da operação. Desliga a câmera e
      // redesenha a tela, para não deixar aberto um formulário que já não
      // funciona nem uma captura de vídeo sem dono.
      leitor?.parar();
      area.innerHTML = await telaSemAcesso();
      return;
    }
    botao.disabled = false;
    botao.textContent = textoOriginal;
  }
}

function confirmarRegistro(item, etapaId, dados) {
  const cat = categoria(item.categoria);
  const destino = definicaoEtapa(etapaId);
  const ponto = pontos.find((p) => p.id === (operador.pontoId || dados.pontoId));
  const precisaApagamento = etapaId === 'EM_TRIAGEM' && exigeApagamento(item.categoria);

  const corpo = `
    <p class="sutil" style="margin:0 0 .3rem">Aparelho lido</p>
    <div class="confirmacao-mudanca">
      <code style="color:var(--verde-600);font-weight:700">${escapar(item.codigo)}</code>
      <span>${escapar(cat?.rotulo ?? item.categoria)}${item.marca ? ` · ${escapar(item.marca)}` : ''}</span>
    </div>

    <div class="confirmacao-mudanca">
      ${seloEtapa(item.etapaAtual)}
      <span aria-hidden="true">→</span>
      ${seloEtapa(etapaId)}
    </div>

    <dl class="trilha-dados">
      <div><dt>Assinado por</dt><dd>${escapar(operador.nome)}</dd></div>
      <div><dt>Local</dt><dd>${ponto ? `${escapar(ponto.nome)} — ${escapar(ponto.municipio)}` : 'Não informado'}</dd></div>
      ${dados.observacao ? `<div><dt>Observação</dt><dd>${escapar(dados.observacao)}</dd></div>` : ''}
      ${precisaApagamento ? `
        <div><dt>Mídia</dt><dd>${escapar(MIDIAS[dados.apagamento?.midia]?.rotulo ?? '—')}</dd></div>
        <div><dt>Apagamento</dt><dd>${escapar(METODOS_APAGAMENTO[dados.apagamento?.metodo]?.rotulo ?? '—')}</dd></div>` : ''}
    </dl>

    ${precisaApagamento ? `
      <p class="dica">
        Ao confirmar, você declara que os dados deste aparelho foram destruídos
        pelo método acima. O atestado fica público na consulta do código.
      </p>` : ''}`;

  return confirmar({
    titulo: `Registrar "${destino.rotulo}"?`,
    corpo,
    alerta: `<strong>Este registro é definitivo.</strong> O histórico da cadeia de
             custódia é somente de acréscimo: o próprio banco recusa alterar ou
             apagar um evento já gravado. Confira o código do aparelho antes de
             confirmar.`,
    confirmar: 'Confirmar e registrar',
    cancelar: 'Voltar e corrigir',
  });
}

/* Um código na URL (?c=) abre direto — útil ao vir de outra tela. */
function abrirDaUrl() {
  const daUrl = normalizarCodigo(new URLSearchParams(location.search).get('c'));
  if (daUrl) abrir(daUrl);
}
</script>

</body>
</html>
