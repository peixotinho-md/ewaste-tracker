[pytest]
# `backend` no caminho de import: os módulos do servidor são importados como
# `app`, `banco` e `modelo`, do mesmo jeito que o próprio app.py faz.
pythonpath = backend
testpaths = testes

# Nomes em português, como o resto do projeto. O padrão do pytest é `test_*`;
# manter `teste_*` custa estas duas linhas e evita a única palavra em inglês
# num repositório em que rota, tabela, coluna e classe de CSS são em português.
python_files = teste_*.py
python_functions = teste_*

addopts = -q
